<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Ear Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <script>
    // Theme bootstrap: applies light or dark before first paint so there is
    // no flash of the wrong theme. No stored choice: the system preference
    // decides — dark when (prefers-color-scheme: dark) matches or matchMedia
    // is unavailable, light only when (prefers-color-scheme: light) matches —
    // falling back to dark, the app's original look. public/quiz.js resolves
    // the mode the same way.
    (function () {
      var mode = 'dark';
      if (window.matchMedia) {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) mode = 'light';
      }
      document.documentElement.classList.toggle('dark', mode === 'dark');
    })();
  </script>
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945). This
       scaffold paints a dark page (the body now uses light-first classes
       with a dark: variant), so
       without this tag a brand-new app sits under a light bar. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">
  <main class="max-w-md mx-auto px-4 py-10 flex flex-col gap-6">

    <!-- HOME SCREEN -->
    <div id="home-screen" class="flex flex-col gap-6">
      <div class="flex items-start justify-between gap-2">
        <section class="text-center flex flex-col items-center gap-2">
          <h1 class="text-2xl font-bold">Ear Trainer</h1>
          <p class="text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed">Train your ear to hear notes, chords and progressions. Pick a lesson to start.</p>
        </section>
      </div>

      <p id="home-message" class="hidden text-sm text-red-400 text-center"></p>

      <div id="lesson-groups" class="flex flex-col gap-8"></div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden flex flex-col gap-6">
      <section class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 p-5 flex flex-col gap-4">
        <div class="flex items-baseline justify-between gap-2">
          <h1 id="quiz-title" class="text-xl font-bold">Lesson</h1>
          <button id="back-btn" class="text-xs text-zinc-500 dark:text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-300 cursor-pointer">Back to lessons</button>
        </div>
        <p id="quiz-desc" class="text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed"></p>

        <div id="quiz-area" class="hidden flex-col gap-4">
          <p id="size-note" class="text-sm text-zinc-500 dark:text-zinc-500"></p>
          <p id="quiz-progress" class="text-xs text-zinc-500 dark:text-zinc-500"></p>
          <p id="playback-error" class="hidden text-sm text-red-400">Playback not supported in this browser.</p>
          <button id="play-btn" class="hidden rounded-lg bg-violet-600 hover:bg-violet-500 px-4 py-3 font-semibold text-white cursor-pointer transition-colors">
            Play
          </button>
          <p id="feedback" class="text-sm text-zinc-700 dark:text-zinc-300 min-h-[1.5rem]"></p>
          <div id="answers" class="flex flex-col gap-2"></div>
          <button id="next-btn" class="hidden rounded-lg border border-violet-600 hover:border-violet-500 px-4 py-3 font-semibold text-violet-300 cursor-pointer transition-colors">
            Next question
          </button>
        </div>

        <div id="results" class="hidden flex-col items-center gap-4">
          <h2 class="text-lg font-semibold">Results</h2>
          <p id="score" class="text-xl text-zinc-900 dark:text-zinc-100"></p>
          <div class="flex gap-3 w-full">
            <button id="retry-btn" class="flex-1 rounded-lg bg-violet-600 hover:bg-violet-500 px-4 py-3 font-semibold text-white cursor-pointer transition-colors">Retry</button>
            <button id="back-btn2" class="flex-1 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:border-zinc-600 dark:hover:border-zinc-500 px-4 py-3 font-semibold text-zinc-800 dark:text-zinc-200 cursor-pointer transition-colors">Back to lessons</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/curriculum.js"></script>
  <script src="/quiz.js"></script>
</body>
</html>
